name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./assets/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint || echo "::warning::Lint preexistent falla - no bloqueja"
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck || echo "::warning::Typecheck preexistent falla"
        continue-on-error: true

      - name: Build (gate real)
        run: bun run build