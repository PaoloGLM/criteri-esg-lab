<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-label="Terrasses: estrats de territori i criteri que s'acumulen amb el temps">
  <rect width="900" height="675" fill="#F2F5F1"/>
  <!-- Estrats de terra (arrelament) -->
  <g>
    <path d="M0 560 Q 225 520 450 545 T 900 540 L 900 675 L 0 675 Z" fill="#AAC9B6"/>
    <path d="M0 590 Q 225 560 450 580 T 900 575 L 900 675 L 0 675 Z" fill="#5E8772" opacity=".8"/>
    <path d="M0 625 Q 225 600 450 618 T 900 612 L 900 675 L 0 675 Z" fill="#26312B"/>
  </g>
  <!-- Sol daurat: el bé comú com a referent -->
  <circle cx="680" cy="170" r="62" fill="#F5E381"/>
  <circle cx="680" cy="170" r="80" fill="none" stroke="#F5E381" stroke-width="2" stroke-dasharray="3 9"/>
  <!-- Terrasses en pujada: el criteri es fa amb el temps -->
  <g fill="none" stroke-linecap="round">
    <path d="M110 470 H 240" stroke="#26312B" stroke-width="6"/>
    <path d="M170 410 H 330" stroke="#26312B" stroke-width="6"/>
    <path d="M240 350 H 430" stroke="#26312B" stroke-width="6"/>
    <path d="M320 290 H 540" stroke="#5E8772" stroke-width="6"/>
    <path d="M410 235 H 560" stroke="#26312B" stroke-width="6"/>
  </g>
  <!-- Llavor/estrella: la tecnologia com a eina plantada -->
  <g transform="translate(130,470)">
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#26312B" stroke-width="3.5"/>
    <g fill="#F2F5F1" stroke="#26312B" stroke-width="2">
      <ellipse cx="0" cy="-52" rx="9" ry="15"/>
      <ellipse cx="-12" cy="-44" rx="8" ry="13" transform="rotate(-40 -12 -44)"/>
      <ellipse cx="12" cy="-44" rx="8" ry="13" transform="rotate(40 12 -44)"/>
    </g>
  </g>
</svg>
